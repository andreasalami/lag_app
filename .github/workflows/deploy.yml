name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/lag-security" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8

      - name: Test database migrations and security
        env:
          LAG_AUDIT_PGLITE_MODULE: ${{ runner.temp }}/lag-security/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node scripts/security/verify-migrations.mjs
          node scripts/security/verify-public-orders.mjs
          node scripts/security/verify-workflow-safety.mjs
          node scripts/security/verify-push.mjs
          node scripts/security/verify-recovery.mjs
          node scripts/security/verify-kitchen-capacity.mjs
          node docs/anteprime-ordini/verify-partial-pickup.mjs

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Check and test Edge functions
        run: |
          deno check --frozen --config supabase/functions/send-push-broadcast/deno.json supabase/functions/send-push-broadcast/index.ts
          deno check --frozen --config supabase/functions/register-push/deno.json supabase/functions/register-push/index.ts
          deno test --frozen --allow-env --config supabase/functions/submit-order/deno.json supabase/functions/submit-order/index.deno.ts

      - name: Build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
          VITE_EVENTBRITE_EVENT_ID: ${{ vars.VITE_EVENTBRITE_EVENT_ID }}
          VITE_INSTAGRAM_HANDLE: ${{ vars.VITE_INSTAGRAM_HANDLE }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VITE_SUPABASE_URL secret" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing VITE_SUPABASE_ANON_KEY secret" && exit 1)
          test -n "$VITE_WEB_PUSH_PUBLIC_KEY" || (echo "Missing VITE_WEB_PUSH_PUBLIC_KEY variable" && exit 1)
          test -n "$VITE_TURNSTILE_SITE_KEY" || (echo "Missing VITE_TURNSTILE_SITE_KEY variable" && exit 1)
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
