name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  verify-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start clean Supabase and apply every migration
        run: supabase start
      - name: Database regression tests
        run: supabase test db
      - name: Order workflow stress tests
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          LOADTEST_CONFIRM=LOCAL_SUPABASE_ONLY \
          LOADTEST_SUPABASE_URL="$API_URL" \
          LOADTEST_SUPABASE_ANON_KEY="$ANON_KEY" \
          LOADTEST_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npm run stress:orders

  build-and-deploy:
    if: github.event_name == 'push'
    needs: [verify-frontend, verify-database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
          VITE_EVENTBRITE_EVENT_ID: ${{ vars.VITE_EVENTBRITE_EVENT_ID }}
          VITE_INSTAGRAM_HANDLE: ${{ vars.VITE_INSTAGRAM_HANDLE }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VITE_SUPABASE_URL secret" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing VITE_SUPABASE_ANON_KEY secret" && exit 1)
          test -n "$VITE_WEB_PUSH_PUBLIC_KEY" || (echo "Missing VITE_WEB_PUSH_PUBLIC_KEY variable" && exit 1)
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
